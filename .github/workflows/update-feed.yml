name: Paivita RSS-syotteet

on:
  schedule:
    # Ajetaan 4 tunnin valein (UTC-ajat: 5, 9, 13, 17, 21, 1)
    - cron: "0 5,9,13,17,21,1 * * *"
  workflow_dispatch: {}  # sallii manuaalisen ajon GitHubin kayttoliittymasta

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Asenna Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Aja Konservatorio-scraperi
        run: python scraper.py

      - name: Aja Annala-scraperi
        run: python annala_scraper.py

      - name: Committaa feedit ja state, jos muuttuneet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml feed-annala.xml state-annala.json
          git diff --staged --quiet || git commit -m "Paivita RSS-syotteet"
          git push
