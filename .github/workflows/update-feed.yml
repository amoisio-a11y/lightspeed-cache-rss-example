name: Paivita RSS-syote

on:
  schedule:
    # Ajetaan 4 tunnin valein (UTC-ajat: 5, 9, 13, 17, 21, 1)
    - cron: "0 5,9,13,17,21,1 * * *"
  workflow_dispatch: {}  # sallii manuaalisen ajon GitHubin kayttoliittymasta

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Aja scraperi
        run: python scraper.py

      - name: Committaa feed.xml, jos muuttunut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Paivita RSS-syote"
          git push
